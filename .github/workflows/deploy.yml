name: Deploy React app to GitHub Pages

on:
  push:
    branches:
      - onlineVersion   # or master, depending on your repo
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./combiner-typescript
    steps:
     
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: ./combiner-typescript/package-lock.json

      
        
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Add 404.html for SPA
        run: cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./combiner-typescript/dist   # change to ./build if using CRA
